[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "developer-cli-toolkit"
version = "0.1.0"
description = "A modern CLI toolkit for developers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Salim Momin" }
]

keywords = [
    "cli",
    "developer",
    "python",
    "terminal",
    "git",
    "json",
    "yaml",
    "api",
    "toolkit",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Salim-Momin/developer-cli-toolkit"
Repository = "https://github.com/Salim-Momin/developer-cli-toolkit"
Issues = "https://github.com/Salim-Momin/developer-cli-toolkit"

[project.scripts]
devkit = "devkit.main:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]