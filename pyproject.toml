[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "developer-cli-toolkit"
version = "0.1.0"
description = "A modern CLI toolkit for developers."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "typer>=0.12",
    "rich>=13"
]

[project.scripts]
devkit = "devkit.main:app"

[tool.setuptools.packages.find]
where = ["src"]